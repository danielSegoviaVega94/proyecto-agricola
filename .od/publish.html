<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Publicar producto — Punto de Venta Agricultura</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .photo-uploader {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--sp-2);
  }
  .photo-uploader .slot {
    aspect-ratio: 1 / 1;
    border-radius: var(--r-md);
    background: var(--brand-soft);
    color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .photo-uploader .slot.empty {
    background: var(--bg);
    border: 2px dashed var(--border);
    color: var(--text-muted);
  }
  .photo-uploader .slot button.del {
    position: absolute; top: 6px; right: 6px;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(0,0,0,0.6); color: white;
    display: flex; align-items: center; justify-content: center;
    border: none;
  }
  .photo-uploader .slot.main::before {
    content: 'Principal';
    position: absolute; bottom: 6px; left: 6px;
    background: var(--brand); color: white;
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: var(--r-pill);
  }
  .tier-editor { display: flex; flex-direction: column; gap: var(--sp-3); }
  .tier-row {
    display: grid;
    grid-template-columns: 1fr 1fr 44px;
    gap: var(--sp-2);
    align-items: end;
  }
  .tier-row .input { height: 48px; font-size: var(--fs-sm); }
  .tier-row .del-btn {
    width: 44px; height: 48px;
    border: 1.5px solid var(--border); background: var(--surface);
    border-radius: var(--r-md); color: var(--danger);
    display: flex; align-items: center; justify-content: center;
  }
  .tier-row label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: block; font-weight: 500; }
  .submit-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border-soft);
    padding: var(--sp-3) var(--sp-4);
  }
  @media (min-width: 768px) {
    .submit-bar { position: absolute; max-width: 420px; margin: 0 auto;
      border-bottom-left-radius: 32px; border-bottom-right-radius: 32px; }
  }
</style>
</head>
<body>
<div class="phone-frame">
  <header class="app-header">
    <button class="icon-btn" aria-label="Volver" onclick="history.back()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <h1>Publicar producto</h1>
    <span style="width: 44px;"></span>
  </header>

  <main class="content" style="padding-bottom: 100px;">
    <h2 class="section-title" style="margin-top: var(--sp-2);">Fotos</h2>
    <p class="text-muted" style="font-size: var(--fs-sm); margin: -8px 0 var(--sp-3);">Sube hasta 5 fotos. La primera será la principal.</p>
    <div class="photo-uploader">
      <div class="slot main">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 0 2 .8 2 2-.5 0-1 .3-1.3.8C13.6 5 14 6 14 6.5c.5-1 1.5-1.5 2.5-1.5 2 0 4 1.8 4 4.5 0 5-4 11-8.5 11S3.5 14.5 3.5 9.5C3.5 6.8 5.5 5 7.5 5c1 0 2 .5 2.5 1.5 0-.5.4-1.5 1.3-1.7C11 4.3 10.5 4 10 4c0-1.2 1-2 2-2z"/></svg>
        <button class="del" aria-label="Quitar foto"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="slot">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" opacity=".5"><path d="M12 2c1 0 2 .8 2 2-.5 0-1 .3-1.3.8C13.6 5 14 6 14 6.5c.5-1 1.5-1.5 2.5-1.5 2 0 4 1.8 4 4.5 0 5-4 11-8.5 11S3.5 14.5 3.5 9.5C3.5 6.8 5.5 5 7.5 5c1 0 2 .5 2.5 1.5 0-.5.4-1.5 1.3-1.7C11 4.3 10.5 4 10 4c0-1.2 1-2 2-2z"/></svg>
        <button class="del" aria-label="Quitar foto"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="slot empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>

    <h2 class="section-title">Datos básicos</h2>

    <div class="field">
      <label for="title">Título</label>
      <input id="title" class="input" type="text" placeholder="Ej: Tomate orgánico recién cosechado" />
    </div>

    <div class="field">
      <label for="cat">Categoría</label>
      <select id="cat" class="select">
        <option>Verduras → Tomate</option>
        <option>Verduras → Lechuga</option>
        <option>Frutas → Uva</option>
      </select>
    </div>

    <div class="row gap-3" style="display: grid; grid-template-columns: 1fr 1fr;">
      <div class="field">
        <label for="unit">Unidad</label>
        <select id="unit" class="select">
          <option>Kilo (kg)</option>
          <option>Unidad</option>
          <option>Caja</option>
          <option>Saco</option>
          <option>Litro</option>
        </select>
      </div>
      <div class="field">
        <label for="stock">Stock disponible</label>
        <input id="stock" class="input" type="number" inputmode="decimal" placeholder="200" />
      </div>
    </div>

    <div class="field">
      <label for="comuna">Comuna del producto</label>
      <select id="comuna" class="select">
        <option>Vicuña</option>
        <option>La Serena</option>
      </select>
    </div>

    <div class="field">
      <label for="desc">Descripción <span class="text-muted">(opcional)</span></label>
      <textarea id="desc" class="textarea" placeholder="Cuenta cómo cosechas, días de cosecha, si retiran o entregas..."></textarea>
    </div>

    <h2 class="section-title">Tramos de precio</h2>
    <p class="text-muted" style="font-size: var(--fs-sm); margin: -8px 0 var(--sp-3);">Mientras más cantidad, más bajo el precio. Mínimo un tramo.</p>

    <div class="tier-editor">
      <div class="tier-row">
        <div>
          <label>Desde</label>
          <input class="input" type="number" inputmode="decimal" value="0" />
        </div>
        <div>
          <label>Precio / kg</label>
          <input class="input" type="number" inputmode="decimal" value="2000" />
        </div>
        <button class="del-btn" aria-label="Quitar tramo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
      <div class="tier-row">
        <div>
          <input class="input" type="number" inputmode="decimal" value="10" />
        </div>
        <div>
          <input class="input" type="number" inputmode="decimal" value="1500" />
        </div>
        <button class="del-btn" aria-label="Quitar tramo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
      <div class="tier-row">
        <div>
          <input class="input" type="number" inputmode="decimal" value="30" />
        </div>
        <div>
          <input class="input" type="number" inputmode="decimal" value="1300" />
        </div>
        <button class="del-btn" aria-label="Quitar tramo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </div>
    <button class="btn btn-secondary mt-3 btn-block">+ Agregar otro tramo</button>
  </main>

  <div class="submit-bar">
    <a href="product.html" class="btn btn-primary">Publicar ahora</a>
  </div>
</div>
</body>
</html>
